[project]
name = "quant-trading-assessment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"